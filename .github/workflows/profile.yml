name: Refresh profile graphics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate graphics from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate.py
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg assets/stats.svg assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile graphics"
            git push
          fi
